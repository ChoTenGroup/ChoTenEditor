    if_else: 'Grundlegende Logikanweisung.<br>Ist der {Rückgabewert} einer Aktion {ja}, führe die zweite Aktion aus; andernfalls führe die dritte aus.'
    literal: 'Erstellt und gibt eine {Zeichenkette} zurück.<br>Enthält die Zeichenkette Leerzeichen, umschließe sie mit {doppelten Anführungszeichen} oder {einfachen Anführungszeichen}; ohne Leerzeichen dürfen die Anführungszeichen weggelassen werden.<br><br>{Hinweis:}<br>Auch {literal 100} ist keine Ganzzahl; verwende bei Bedarf die {#Type}-Aktion.'
    not: 'Prüft, ob der {Rückgabewert} der Aktion {falsch} ist, d. h. das Ergebnis wird negiert.'
    repeat: Wiederholt eine Aktion mehrere Male.
    sleep: Blockiert den Worker-Thread für eine bestimmte Zeit.
    variable_get: Ruft eine Variable ab.
    variable_set: 'Setzt eine Variable auf einen {primitiven Typ} oder den {Rückgabewert} einer Aktion.'
    while: 'Grundlegende Logikanweisung.<br>Solange der {Rückgabewert} der ersten Aktion {ja} ist, wiederhole die zweite Aktion, bis er {falsch} wird.'
    absorption_amount: 'Ruft die Absorptionslebenspunkte des Spielers ab oder legt sie fest.'
    action_bar: 'Sendet den {Rückgabewert} der Aktion als {Action-Bar}-Nachricht an den {Ausführer}.'
    address: 'Ruft die IP-Adresse des Spielers ab.'
    allow_flight: Prüft oder ändert, ob der Spieler fliegen darf.
    array: 'Gibt alle {Rückgabewerte} der Aktionsliste als {Sammlung} zurück.'
    attack_cooldown: 'Ruft den Angriffs-Cooldown des Spielers ab.'
    bed_spawn: 'Ruft den Bett-Spawnpunkt des Spielers ab oder ändert ihn; der Block muss ein Bett sein.'
    'bed_spawn_x,y,z': 'Ruft eine Achse des Bett-Spawnpunkts des Spielers ab.'
    blocking: Prüft, ob der Spieler gerade blockt.
    break: 'Beendet den Schleifenkörper, wenn er innerhalb von Schleifenanweisungen verwendet wird ({ForEach, Join, Map, While}).'
    'case & when': 'Eine komplexe Auswahl-Anweisung mit mehr Funktionen als #IF.<br>Eine vollständige Auswahl-Anweisung benötigt mindestens einen Zweig, d. h. einen {when-Block}.<br><br>Jeder Standard-Zweig besteht aus {when} {{condition}} -> {{expression}}.<br>Du kannst auch {else} {{expression}} als Standard-Zweig verwenden.<br><br>{Hier ein Beispiel:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{Das Ergebnis ist:}<br>You provide Three<br><br>{Sie kann auch wie andere Anweisungen verwendet werden:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{Oder mit mehreren Anweisungen:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{Oder für Logikprüfungen:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: 'Vergleicht die {Rückgabewerte} zweier Aktionen mit mehreren Vergleichsmodi.<br><br>1. Gleich ({==}, {is}): die beiden Werte sind {wortwörtlich} gleich.<br>2. Ungleich ({!=}, {not}): die beiden Werte sind {wortwörtlich} verschieden.<br>3. Ähnlich gleich ({=?}, {is?}): die beiden Werte sind {wortwörtlich} gleich, wenn {Groß-/Kleinschreibung ignoriert wird}.<br>4. Absolut gleich ({=!}, {is!}): die beiden Werte sind im {Speicher} gleich.<br>5. Größer als ({>}, {gt}): der erste Wert ist {größer als} der zweite.<br>6. Größer oder gleich ({>=}): der erste Wert ist {größer als} oder {gleich} dem zweiten.<br>7. Kleiner als ({<}, {lt}): der erste Wert ist {kleiner als} der zweite.<br>8. Kleiner oder gleich ({<=}): der erste Wert ist {kleiner als} oder {gleich} dem zweiten.<br>9. Rechts enthält links (in): ob der zweite Wert den ersten enthält.<br>10. Links enthält rechts (has): ob der erste Wert den zweiten enthält.<br><br>{Hinweis:}<br>Beim Vergleich mit einer {Gleichheits}-Bedingung werden beiden Argumenten automatisch {#Type}-Inferenzaktionen angehängt.'
    color: 'Ersetzt alle {Farbcodes} im {Rückgabewert} der Aktion.<br>Erweiterte Farbcodes von {TabooLib} werden unterstützt.'
    command: 'Führt den {Rückgabewert} der Aktion als Befehl aus, standardmäßig mit dem {Spieler} als Ausführer.'
