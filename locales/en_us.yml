    blocking: Check whether the player is blocking.
    break: 'Ends the loop body when used inside loop statements ({ForEach, Join, Map, While}).'
    'case & when': 'A complex selection statement with richer features than #IF.<br>A complete selection statement needs at least one branch, i.e. a {when block}.<br><br>Each standard branch consists of {when} {{condition}} -> {{expression}}.<br>You can also use {else} {{expression}} as the default branch.<br><br>{Here is an example:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{The result is:}<br>You provide Three<br><br>{It can also be used like other statements:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{Or with multiple statements:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{Or for logic checks:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: 'Compare the {return values} of two actions with multiple comparison modes.<br><br>1. Equal ({==}, {is}): the two values are the same {literally}.<br>2. Not equal ({!=}, {not}): the two values differ {literally}.<br>3. Similar equal ({=?}, {is?}): the two values are the same {literally} when {case is ignored}.<br>4. Absolute equal ({=!}, {is!}): the two values are the same in {memory}.<br>5. Greater than ({>}, {gt}): the first value is {greater than} the second.<br>6. Greater or equal ({>=}): the first value is {greater than} or {equal to} the second.<br>7. Less than ({<}, {lt}): the first value is {less than} the second.<br>8. Less or equal ({<=}): the first value is {less than} or {equal to} the second.<br>9. Right contains left (in): whether the second value contains the first.<br>10. Left contains right (has): whether the first value contains the second.<br><br>{Note:}<br>When comparing with an {equal} condition, {#Type} inference actions are automatically appended to both arguments.'
    color: 'Replace all {color codes} in the action''s {return value}.<br>Advanced color codes provided by {TabooLib} are supported.'
    command: 'Execute the action''s {return value} as a command, defaulting to the {player} as executor.'
    compass_target: 'Get or change the player''s compass target.'
    'compass_x,y,z': 'Get an axis of the player''s compass target.'
    conversing: 'Tests to see if a Conversable object is actively engaged in a conversation.<br><br>{Returns:}<br>True if a conversation is in progress'
    date_day: 'The day of the year, month, or week.<br>Year: ({1} ~ {365})<br>Month: ({1} ~ {31})<br>Week: ({1} ~ {7})'
    date_hour: 'The current hour ({0} ~ {23}).'
    date_minute: 'The current minute ({0} ~ {59}).'
    date_month: 'The current month ({1} ~ {12}).'
    date_second: 'The current second ({0} ~ {59}).'
    date_year: 'The current year ({MIN_YEAR} ~ {MAX_YEAR}).'
