    type: 'Create and return the closest matching {string}, {integer}, {long}, {float}, or {boolean}.<br>When the string contains spaces, wrap it in {double quotes} or {single quotes}; quotes may be omitted when there are no spaces.<br><br>Or format with a {specific type} (passing an action as the argument):<br>int, long, float, double, boolean'
