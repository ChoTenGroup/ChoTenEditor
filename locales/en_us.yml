    map: 'Iterate over all {members} of the first action''s {return value}, passing each as a {temporary variable} to the second action.<br>Finally, return all {return values} of the second action as a {collection}.<br><br>Unlike {#ForEach}, {#Map} collects every non-empty result.<br><br>Returns a list containing the results of applying the given transform function to each element in the original collection.'
