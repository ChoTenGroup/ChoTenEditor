    equipment_check: 'Check whether the player''s equipment is a specific item using {Chemdah} item expressions.<br>See the {Chemdah} documentation for expression help.<br><br>Available slots:<br>{Main hand}: hand, mainhand<br>{Off hand}: offhand<br>{Helmet}: head, helmet<br>{Chestplate}: chest, chestplate<br>{Leggings}: legs, leggings<br>{Boots}: boots, feet'
