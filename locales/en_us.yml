    automation: Automates starting quest flows / Checks online players every 40 ticks to handle auto-accept and scheduled quests
    ui: 'Configures how quests appear in the UI / Controls quest visibility, icon, and description'
    depend: 'Sets quest prerequisites / Supports single quest and quest group dependencies / Supports dependencies between entries / Can be a string, list, or comma/semicolon-separated string'
    stats: 'Displays quest and entry progress / Supports BossBar progress bar, custom styles, and script calculations / Configurable as temporary or persistent display'
    restart: Controls whether a quest can be restarted / Defines restart conditions via Kether scripts
    track: 'Tracks quest objective locations and provides path guidance / Supports beacon, landmark, navigation, and scoreboard display / A player can only track one quest at a time'
    party: 'Manages party features for quests / Supports quest sharing, cooperative completion, and player limits / For team dungeons, multiplayer cooperation, etc.'
    timeout: Sets a timeout for quests / Supports fixed duration and periodic time points
    reset-data-on-accepted: 'Controls whether specific data is reset when a quest is accepted / Only affects entries implementing the IPlayerData interface / For resetting count, progress, and state data'
    optional: 'Marks a quest entry as optional / Optional entries do not affect quest completion / For bonus rewards, side quests, etc.'
    control: 'Manages various quest restrictions / Supports coexistence, repeat, cooldown limits, and script proxies / Configured as a Map list, each Map representing a control rule'
