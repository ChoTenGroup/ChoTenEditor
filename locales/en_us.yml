    tell: 'Send the action''s {return value} to the {executor} as a message.'
    time: 'The current system time.<br><br>Returns the current time in milliseconds. Note that while the unit of time of the return value is a millisecond, the granularity of the value depends on the underlying operating system and may be larger. For example, many operating systems measure time in units of tens of milliseconds.<br>See the description of the class Date for a discussion of slight discrepancies that may arise between "computer time" and coordinated universal time (UTC).<br><br>{Returns: }the difference, measured in milliseconds, between the current time and midnight, January 1, 1970 UTC.'
    time_format: 'Format the current system time with a specific {format}.<br><br>'
    title: 'Send the action''s {return value} to the {executor} as a {title}; the default fade in, stay, fade out times are {0}, {20}, {0}.'
