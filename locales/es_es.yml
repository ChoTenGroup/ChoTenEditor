    blocking: Comprueba si el jugador está bloqueando.
    break: 'Finaliza el cuerpo del bucle cuando se usa dentro de declaraciones de bucle ({ForEach, Join, Map, While}).'
    'case & when': 'Una declaración de selección compleja con más funciones que #IF.<br>Una declaración de selección completa necesita al menos una rama, es decir, un {bloque when}.<br><br>Cada rama estándar consiste en {when} {{condición}} -> {{expresión}}.<br>También puedes usar {else} {{expresión}} como rama predeterminada.<br><br>{Aquí tienes un ejemplo:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{El resultado es:}<br>You provide Three<br><br>{También se puede usar como otras declaraciones:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{O con múltiples declaraciones:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{O para comprobaciones lógicas:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: 'Compara los {valores devueltos} de dos acciones con múltiples modos de comparación.<br><br>1. Igual ({==}, {is}): los dos valores son el mismo {literalmente}.<br>2. Distinto ({!=}, {not}): los dos valores difieren {literalmente}.<br>3. Igualdad similar ({=?}, {is?}): los dos valores son el mismo {literalmente} cuando {se ignoran mayúsculas y minúsculas}.<br>4. Igualdad absoluta ({=!}, {is!}): los dos valores son el mismo en {memoria}.<br>5. Mayor que ({>}, {gt}): el primer valor es {mayor que} el segundo.<br>6. Mayor o igual ({>=}): el primer valor es {mayor que} o {igual a} el segundo.<br>7. Menor que ({<}, {lt}): el primer valor es {menor que} el segundo.<br>8. Menor o igual ({<=}): el primer valor es {menor que} o {igual a} el segundo.<br>9. La derecha contiene a la izquierda (in): si el segundo valor contiene al primero.<br>10. La izquierda contiene a la derecha (has): si el primer valor contiene al segundo.<br><br>{Nota:}<br>Al comparar con una condición de {igualdad}, las acciones de inferencia {#Type} se añaden automáticamente a ambos argumentos.'
