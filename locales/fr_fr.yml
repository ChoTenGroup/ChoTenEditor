  objective:
    'player fish': 'Pêche du joueur / Prend en charge des conditions sur l''état du poisson, le type d''objet, l''expérience, etc. / Compte les tentatives de pêche'
    'player chat': 'Le joueur envoie un message de chat / Prend en charge des conditions sur le contenu du message, l''emplacement, etc. / Compte les messages de chat'
    'change world': 'Le joueur change de monde / Prend en charge des conditions sur le monde source, le monde cible, l''emplacement, etc. / Compte les changements'
    'player kill': 'Le joueur tue une entité / Prend en charge des conditions sur l''arme, le type de victime, etc. / Compte les kills'
    'food change': 'Se déclenche quand la faim du joueur change / Prend en charge des conditions sur la valeur de faim, le type de nourriture, etc. / Compte la variation totale de faim'
    'item break': 'Se déclenche quand la durabilité de l''outil ou de l''armure du joueur s''épuise / Prend en charge des conditions sur le type d''objet, l''emplacement, etc. / Compte les objets cassés'
    'custom level': 'Vérifie si le niveau personnalisé du joueur atteint le seuil requis / Prend en charge des conditions sur l''emplacement, l''ID de niveau, la valeur de niveau, etc. / Pour le système de niveaux Chemdah'
    'player move': 'Le joueur se déplace / Prend en charge des conditions sur la position de départ, la position cible, etc. / Compte les déplacements'
    'block interact': 'Le joueur interagit avec un bloc / Prend en charge des conditions sur le matériau, le type d''interaction, la direction, l''objet tenu, etc. / Compte les interactions'
    'entity tame': 'Le joueur apprivoise une entité / Prend en charge des conditions sur le type d''entité, l''emplacement, etc. / Compte les entités apprivoisées'
    'horse jump': 'Se déclenche quand le joueur saute à cheval / Prend en charge des conditions sur la force du saut, le type de cheval, etc. / Compte les sauts'
    'block break': 'Le joueur casse un bloc / Prend en charge des conditions sur le matériau, l''emplacement, les butins, etc. / Compte les blocs cassés'
    'bucket fill': 'Le joueur remplit un seau avec un fluide / Prend en charge des conditions sur l''emplacement, le matériau, l''objet, etc. / Compte les remplissages'
    'bucket empty': 'Le joueur vide un fluide d''un seau / Prend en charge des conditions sur l''emplacement, le matériau, l''objet, etc. / Compte les vidages'
    'item consume': Se déclenche quand le joueur consomme un objet / Prend en charge les consommables tels que la nourriture et les potions / Compte les objets consommés
    'pickup exp': 'Se déclenche quand le joueur ramasse une orbe d''expérience / Prend en charge des conditions sur la quantité d''expérience, la raison, etc. / Compte l''expérience totale ramassée'
    'player teleport': 'Le joueur se téléporte / Prend en charge des conditions sur la position de départ, la position cible, la raison de téléportation, etc. / Compte les téléportations'
    always: 'Vérifie la condition à chaque tick de jeu / Pour les scénarios nécessitant une condition constamment remplie / Aucun déclencheur d''événement, vérification périodique automatique'
    'shoot bow': 'Le joueur tire à l''arc / Prend en charge des conditions sur le type d''arc, la force de bande, l''objet consommé, etc. / Compte les tirs'
    'player animation': 'Se déclenche quand le joueur joue une animation / Prend en charge des conditions sur le type d''animation, etc. / Compte les exécutions'
    'player attack': 'Le joueur attaque une entité / Prend en charge des conditions sur l''entité cible, l''arme, les dégâts, etc. / Compte les attaques'
    'player damage by entity': 'Le joueur subit des dégâts d''une attaque d''entité / Prend en charge des conditions sur l''entité attaquante, l''arme, les dégâts, etc. / Compte les dégâts subis'
    'entity interact': 'Le joueur fait un clic droit sur une entité / Prend en charge des conditions sur le type d''entité, l''emplacement, l''objet tenu, etc. / Compte les interactions'
    'bed enter': 'Le joueur entre dans un lit / Prend en charge des conditions sur l''emplacement du lit, le matériau, la raison, etc. / Compte les entrées'
    'player anvil': 'Se déclenche quand le joueur utilise une enclume / Prend en charge des conditions sur le texte de renommage, le coût de réparation, l''objet obtenu, etc. / Compte les utilisations'
    'portal exit': 'Se déclenche quand le joueur quitte un portail / Prend en charge des conditions sur les positions cible et de départ, etc. / Compte les sorties'
    never: Objectif qui ne peut jamais être accompli / Pour les espaces réservés ou une logique spéciale / Retourne toujours false
    'pickup arrow': 'Se déclenche quand le joueur ramasse une flèche / Prend en charge des conditions sur le type de flèche, la quantité, etc. / Compte le total ramassé'
    'entity breed': 'Le joueur élève des animaux / Prend en charge des conditions sur le type d''animal, les parents, l''objet d''élevage, etc. / Compte les reproductions'
    'player jump': 'Le joueur saute / Prend en charge des conditions sur l''emplacement, etc. / Compte les sauts'
