    fail: Exécuté avant l'échec de la quête
    failed: Exécuté après l'échec de la quête
    restart: Exécuté avant la réinitialisation de la quête
    restarted: Exécuté après la réinitialisation de la quête
    continued: Exécuté après la poursuite d'une entrée de quête
