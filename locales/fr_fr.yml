    break: "Termine le corps de la boucle lorsqu'il est utilisé dans des instructions de boucle ({ForEach, Join, Map, While})."
    'case & when': 'Une instruction de sélection complexe offrant plus de fonctionnalités que #IF.<br>Une instruction de sélection complète nécessite au moins une branche, c''est-à-dire un {bloc when}.<br><br>Chaque branche standard se compose de {when} {{condition}} -> {{expression}}.<br>Vous pouvez également utiliser {else} {{expression}} comme branche par défaut.<br><br>{Voici un exemple :}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{Le résultat est :}<br>You provide Three<br><br>{Il peut aussi être utilisé comme les autres instructions :}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{Ou avec plusieurs instructions :}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{Ou pour des vérifications logiques :}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: "Compare les {valeurs renvoyées} de deux actions selon plusieurs modes de comparaison.<br><br>1. Égal ({==}, {is}) : les deux valeurs sont identiques {littéralement}.<br>2. Différent ({!=}, {not}) : les deux valeurs sont différentes {littéralement}.<br>3. Égal similaire ({=?}, {is?}) : les deux valeurs sont identiques {littéralement} lorsque la {casse est ignorée}.<br>4. Égal absolu ({=!}, {is!}) : les deux valeurs sont identiques en {mémoire}.<br>5. Supérieur à ({>}, {gt}) : la première valeur est {supérieure à} la seconde.<br>6. Supérieur ou égal ({>=}) : la première valeur est {supérieure à} ou {égale à} la seconde.<br>7. Inférieur à ({<}, {lt}) : la première valeur est {inférieure à} la seconde.<br>8. Inférieur ou égal ({<=}) : la première valeur est {inférieure à} ou {égale à} la seconde.<br>9. La droite contient la gauche (in) : indique si la seconde valeur contient la première.<br>10. La gauche contient la droite (has) : indique si la première valeur contient la seconde.<br><br>{Remarque :}<br>Lors d'une comparaison avec une condition d'{égalité}, des actions d'inférence {#Type} sont automatiquement ajoutées aux deux arguments."
