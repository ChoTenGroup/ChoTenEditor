  addon:
    automation: Automatise le démarrage des flux de quêtes / Vérifie les joueurs en ligne toutes les 40 ticks pour gérer l'acceptation automatique et les quêtes planifiées
    ui: Configure l'apparence des quêtes dans l'interface / Contrôle la visibilité, l'icône et la description des quêtes
    depend: Définit les prérequis de quête / Prend en charge une seule quête ou un groupe de quêtes comme dépendance / Prend en charge les dépendances entre entrées / Peut être une chaîne, une liste ou une chaîne séparée par des virgules ou des points-virgules
    stats: Affiche la progression de la quête et des entrées / Prend en charge la barre BossBar, les styles personnalisés et les calculs par script / Configurable en affichage temporaire ou persistant
    restart: Contrôle si une quête peut être relancée / Définit les conditions de relance via des scripts Kether
    track: Suit les positions des objectifs de quête et fournit un guidage de chemin / Prend en charge l'affichage par balise, point de repère, navigation et tableau des scores / Un joueur ne peut suivre qu'une seule quête à la fois
    party: Gère les fonctionnalités de groupe pour les quêtes / Prend en charge le partage de quêtes, la complétion coopérative et les limites de joueurs / Pour les donjons en équipe, la coopération multijoueur, etc.
    timeout: Définit un délai d'expiration pour les quêtes / Prend en charge une durée fixe et des points temporels périodiques
    reset-data-on-accepted: Contrôle si des données spécifiques sont réinitialisées à l'acceptation d'une quête / N'affecte que les entrées implémentant l'interface IPlayerData / Pour réinitialiser les compteurs, la progression et les états
    optional: Marque une entrée de quête comme optionnelle / Les entrées optionnelles n'affectent pas l'achèvement de la quête / Pour les récompenses bonus, les quêtes secondaires, etc.
    control: Gère diverses restrictions de quête / Prend en charge les limites de coexistence, de répétition, de cooldown et les proxys de script / Configuré sous forme de liste de Map, chaque Map représentant une règle de contrôle
  addonLabel:
    automation: Automatisation des quêtes
    ui: Interface des quêtes
    depend: Dépendance de quête
    stats: Statistiques de quête
    restart: Relance de quête
    track: Suivi de quête
    party: Groupe de quêtes
    timeout: Délai de quête
    reset-data-on-accepted: Réinitialisation à l'acceptation
    optional: Entrée optionnelle
    control: Contrôle de quête
  hook:
    accepted: Exécuté après l'acceptation de la quête
    accept: Exécuté avant l'acceptation de la quête (renvoyer false pour annuler)
    accept_cancelled: Exécuté après l'annulation de l'acceptation de la quête
