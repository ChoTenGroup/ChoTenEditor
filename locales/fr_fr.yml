    'player statistic': 'Se déclenche quand une statistique du joueur change / Prend en charge des conditions sur le type de statistique, le type d''entité, le type de matériau, la valeur, etc. / Compte les incrémentations'
    'entity combust': 'Le joueur enflamme une entité / Prend en charge des conditions sur le type d''entité, l''emplacement, etc. / Compte les inflammations'
    'player damage by block': 'Le joueur subit des dégâts d''un bloc / Prend en charge des conditions sur le type de bloc, les dégâts, l''emplacement, etc. / Compte les dégâts subis'
    'pickup item': 'Se déclenche quand le joueur ramasse un objet jeté / Compte automatiquement la taille de pile des objets ramassés / Prend en charge des conditions sur l''objet, la quantité, l''emplacement, etc.'
    'criterion grant': 'Se déclenche quand le joueur accomplit un critère de progression (nécessite un serveur Paper) / Prend en charge des conditions sur l''ID de progrès, le nom du critère, etc. / Compte les accomplissements'
    'entity dismount': 'Le joueur descend d''une entité / Prend en charge des conditions sur le type d''entité, l''emplacement, etc. / Compte les descentes'
    'player data': 'Vérifie les valeurs de données persistantes du joueur / Prend en charge les modes piloté par événement et vérification périodique / Pour le partage et la vérification de données entre quêtes'
    'exp change': 'Le joueur gagne de l''expérience / Prend en charge des conditions sur la quantité d''expérience, l''entité source, l''emplacement, etc. / Compte l''expérience totale'
    'player shear': 'Le joueur tond un mouton / Prend en charge des conditions sur le type d''entité, le type de cisailles, la main utilisée, etc. / Compte les tontes'
    'block ignite': 'Le joueur enflamme un bloc / Prend en charge des conditions sur le matériau, la raison de l''inflammation, l''emplacement, etc. / Compte les inflammations'
    'item held': 'Se déclenche quand le joueur change l''objet tenu dans la barre principale / Prend en charge des conditions sur les anciens/nouveaux objets, les anciens/nouveaux emplacements, etc. / Compte les changements'
    'entity mount': 'Le joueur monte une entité / Prend en charge des conditions sur le type d''entité, l''emplacement, etc. / Compte les montures'
    'craft item': 'Le joueur fabrique des objets à une table de craft / Prend en charge des conditions sur l''objet, les matériaux de la recette, l''emplacement, etc. / Prend en charge le comptage des fabrications par lot'
    'drop item': 'Se déclenche quand le joueur jette un objet / Prend en charge des conditions sur l''objet, la quantité, l''emplacement, etc. / Compte les jets'
    'armor change': 'Le joueur change son équipement d''armure (nécessite un serveur Paper) / Prend en charge des conditions sur l''emplacement d''équipement, l''objet, etc. / Compte les changements'
    'portal enter': 'Se déclenche quand le joueur entre dans un portail / Prend en charge des conditions sur l''emplacement du portail, etc. / Compte les entrées'
    'enchant item': 'Se déclenche quand le joueur enchante un objet à une table d''enchantement / Prend en charge des conditions sur l''objet, le type d''enchantement, le coût en expérience, etc. / Compte les enchantements'
    'block place': 'Le joueur place un bloc / Prend en charge des conditions sur le matériau, l''emplacement, l''objet tenu, etc. / Compte les poses'
    'player damage': 'Le joueur subit des dégâts / Prend en charge des conditions sur le type de dégâts, la valeur des dégâts, l''emplacement, etc. / Compte les dégâts subis'
    'player respawn': 'Le joueur réapparaît / Prend en charge des conditions sur la position de réapparition, le type de réapparition (lit/ancre de réapparition), etc. / Compte les réapparitions'
    'player real move': 'Se déclenche quand le joueur se déplace réellement d''un bloc / Prend en charge des conditions sur les positions cible et de départ, etc. / Compte les déplacements'
    'player inventory': 'Vérifie ou consomme des objets dans l''inventaire du joueur / Prend en charge des conditions sur l''emplacement, le type d''objet, la quantité, la consommation, etc. / Pour les quêtes de collecte ou de consommation d''objets'
    'block farm': 'Le joueur laboure une terre labourable avec une houe / Prend en charge des conditions sur le matériau, l''emplacement, le type de houe, etc. / Compte les labours'
    'player conversation': 'Le joueur termine une conversation en répondant avec une option / Prend en charge des conditions sur l''emplacement, l''ID de conversation, etc. / Pour le système de conversations interne de Chemdah'
    'item mend': 'Se déclenche quand l''objet du joueur est réparé / Prend en charge des conditions sur le type d''objet réparé, la quantité de réparation, etc. / Compte le total réparé'
    'player conversation refused': 'Le joueur abandonne ou refuse une conversation / Prend en charge des conditions sur l''emplacement, l''ID de conversation, etc. / Pour le système de conversations interne de Chemdah'
    'player toggle flight': 'Se déclenche quand le joueur active ou désactive le vol / Prend en charge des conditions sur l''état de vol, etc. / Compte les bascules'
    'furnace extract': 'Se déclenche quand le joueur récupère des objets d''un four / Compte automatiquement la quantité récupérée / Prend en charge des conditions sur l''objet, l''expérience, l''emplacement, etc.'
    'player conversation closed': 'Le joueur termine normalement une conversation / Prend en charge des conditions sur l''emplacement, l''ID de conversation, etc. / Pour le système de conversations interne de Chemdah'
    'item interact': 'Se déclenche quand le joueur interagit à l''aide d''un objet / Prend en charge le clic droit, le clic gauche, etc. / Permet de vérifier l''emplacement tenu et le type d''interaction'
    trigger: Déclenché manuellement par des commandes ou scripts externes / Prend en charge la correspondance de valeurs de déclencheur personnalisées / Pour la liaison avec d''autres systèmes
    'bed leave': 'Le joueur quitte un lit / Prend en charge des conditions sur l''emplacement du lit, le matériau, etc. / Compte les sorties de lit'
    'level change': 'Le niveau du joueur change / Prend en charge des conditions sur la différence de niveau, le nouveau niveau, l''ancien niveau, etc. / Compte les montées de niveau'
    'player swap hand': 'Se déclenche quand le joueur appuie sur F pour échanger les objets main principale/secondaire / Prend en charge des conditions sur les objets des deux mains, etc. / Compte les échanges'
    'pressure plate': 'Se déclenche quand le joueur marche sur une plaque de pression / Prend en charge des conditions sur l''emplacement et le type de plaque, etc. / Compte les pas'
    'quest data': Vérifie les valeurs de données persistantes de la quête / Prend en charge les modes piloté par événement et vérification périodique / Pour le partage et la vérification de données au sein d''une quête
    'health regain': 'Se déclenche quand la santé du joueur se régénère / Prend en charge des conditions sur la quantité régénérée, la raison, etc. / Compte le total régénéré'
    'player resurrect': 'Se déclenche quand le joueur ressuscite avec un totem d''immortalité / Prend en charge des conditions sur le type d''objet utilisé, etc. / Compte les résurrections'
    'player advancement': 'Le joueur accomplit un progrès / Prend en charge des conditions sur l''ID de progrès, l''emplacement, etc. / Compte les accomplissements'
    'player command': 'Le joueur exécute une commande / Prend en charge des conditions sur le contenu de la commande, l''emplacement, etc. / Compte les exécutions de commandes'
    'edit book': 'Se déclenche quand le joueur modifie ou signe un livre / Prend en charge des conditions sur l''état signé, les pages, le titre, le contenu, etc. / Compte les modifications'
    'player death': 'Le joueur meurt / Prend en charge des conditions sur l''attaquant, l''arme, le message de mort, etc. / Compte les morts'
    'anpc interact': 'Interagir avec un PNJ Adyeshach / Prend en charge des conditions sur l''ID du PNJ, le type, l''emplacement, l''objet tenu, la main principale/secondaire, etc. / Nécessite le plugin Adyeshach'
    'anpc damage': 'Infliger des dégâts à un PNJ Adyeshach / Prend en charge des conditions sur l''ID du PNJ, le type, l''emplacement, l''objet utilisé, etc. / Nécessite le plugin Adyeshach'
    'mythicmobs kill': 'Tuer un monstre MythicMobs / Prend en charge des conditions sur le nom du mob, le niveau, l''emplacement, etc. / Nécessite le plugin MythicMobs'
    'placeholder api': Obtenir les valeurs des variables PlaceholderAPI / Prend en charge toutes les variables PAPI / Nécessite le plugin PlaceholderAPI

