    blocking: '플레이어가 방어(블로킹) 중인지 확인합니다.'
    break: '반복문({ForEach, Join, Map, While}) 내부에서 사용되면 반복 본문을 종료합니다.'
    'case & when': '#IF보다 풍부한 기능을 갖춘 복잡한 선택 문입니다.<br>완전한 선택 문에는 최소 하나의 분기, 즉 {when 블록}이 필요합니다.<br><br>각 표준 분기는 {when} {{condition}} -> {{expression}}으로 구성됩니다.<br>{else} {{expression}}을 기본 분기로 사용할 수도 있습니다.<br><br>{예시는 다음과 같습니다:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{결과는 다음과 같습니다:}<br>You provide Three<br><br>{다른 문처럼 사용할 수도 있습니다:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{또는 여러 문과 함께 사용할 수 있습니다:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{논리 검사에도 사용할 수 있습니다:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: '두 동작의 {반환값}을 여러 비교 모드로 비교합니다.<br><br>1. 같음 ({==}, {is}): 두 값이 {문자 그대로} 동일합니다.<br>2. 같지 않음 ({!=}, {not}): 두 값이 {문자 그대로} 다릅니다.<br>3. 유사 같음 ({=?}, {is?}): {대소문자를 무시하면} 두 값이 {문자 그대로} 동일합니다.<br>4. 절대 같음 ({=!}, {is!}): {메모리}상에서 두 값이 동일합니다.<br>5. 보다 큼 ({>}, {gt}): 첫 번째 값이 두 번째 값보다 {큽니다}.<br>6. 이상 ({>=}): 첫 번째 값이 두 번째 값보다 {크거나} {같습니다}.<br>7. 미만 ({<}, {lt}): 첫 번째 값이 두 번째 값보다 {작습니다}.<br>8. 이하 ({<=}): 첫 번째 값이 두 번째 값보다 {작거나} {같습니다}.<br>9. 오른쪽이 왼쪽을 포함 (in): 두 번째 값이 첫 번째 값을 포함하는지 여부입니다.<br>10. 왼쪽이 오른쪽을 포함 (has): 첫 번째 값이 두 번째 값을 포함하는지 여부입니다.<br><br>{참고:}<br>{같음} 조건으로 비교할 때 양쪽 인수에 {#Type} 추론 동작이 자동으로 추가됩니다.'
