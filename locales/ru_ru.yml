    'case & when': 'Сложный оператор выбора с более широкими возможностями, чем #IF.<br>Полный оператор выбора требует как минимум одну ветвь, то есть {блок when}.<br><br>Каждая стандартная ветвь состоит из {when} {{условие}} -> {{выражение}}.<br>Также можно использовать {else} {{выражение}} как ветвь по умолчанию.<br><br>{Пример:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{Результат:}<br>You provide Three<br><br>{Его также можно использовать как другие операторы:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{Или с несколькими операторами:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{Или для логических проверок:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: 'Сравнить {возвращаемые значения} двух действий с помощью нескольких режимов сравнения.<br><br>1. Равно ({==}, {is}): два значения совпадают {буквально}.<br>2. Не равно ({!=}, {not}): два значения различаются {буквально}.<br>3. Похожее равенство ({=?}, {is?}): два значения совпадают {буквально}, если {регистр игнорируется}.<br>4. Абсолютное равенство ({=!}, {is!}): два значения совпадают по {ссылке в памяти}.<br>5. Больше ({>}, {gt}): первое значение {больше} второго.<br>6. Больше или равно ({>=}): первое значение {больше} или {равно} второму.<br>7. Меньше ({<}, {lt}): первое значение {меньше} второго.<br>8. Меньше или равно ({<=}): первое значение {меньше} или {равно} второму.<br>9. Правое содержит левое (in): содержит ли второе значение первое.<br>10. Левое содержит правое (has): содержит ли первое значение второе.<br><br>{Примечание:}<br>При сравнении с условием {равенства} к обоим аргументам автоматически добавляются действия вывода типа {#Type}.'
