  objective:
    'player fish': 'Игрок ловит рыбу / Поддерживает условия на состояние рыбалки, тип предмета, опыт и т. д. / Считает попытки рыбалки'
    'player chat': 'Игрок отправляет сообщение в чат / Поддерживает условия на содержимое сообщения, местоположение и т. д. / Считает сообщения в чате'
    'change world': 'Игрок меняет мир / Поддерживает условия на исходный мир, целевой мир, местоположение и т. д. / Считает переходы'
    'player kill': 'Игрок убивает сущность / Поддерживает условия на оружие, тип жертвы и т. д. / Считает убийства'
    'food change': 'Срабатывает при изменении сытости игрока / Поддерживает условия на значение сытости, тип еды и т. д. / Считает суммарное изменение сытости'
    'item break': 'Срабатывает, когда прочность инструмента или брони игрока заканчивается / Поддерживает условия на тип предмета, местоположение и т. д. / Считает сломанные предметы'
    'custom level': 'Проверяет, соответствует ли пользовательский уровень игрока требованию / Поддерживает условия на местоположение, ID уровня, значение уровня и т. д. / Для системы уровней Chemdah'
    'player move': 'Игрок перемещается / Поддерживает условия на начальное местоположение, целевое местоположение и т. д. / Считает перемещения'
    'block interact': 'Игрок взаимодействует с блоком / Поддерживает условия на материал, тип взаимодействия, направление, предмет в руке и т. д. / Считает взаимодействия'
    'entity tame': 'Игрок приручает сущность / Поддерживает условия на тип сущности, местоположение и т. д. / Считает приручённые сущности'
    'horse jump': 'Срабатывает, когда игрок прыгает на лошади / Поддерживает условия на силу прыжка, тип лошади и т. д. / Считает прыжки'
    'block break': 'Игрок ломает блок / Поддерживает условия на материал, местоположение, выпадающие предметы и т. д. / Считает сломанные блоки'
    'bucket fill': 'Игрок наполняет ведро жидкостью / Поддерживает условия на местоположение, материал, предмет и т. д. / Считает наполнения'
    'bucket empty': 'Игрок выливает жидкость из ведра / Поддерживает условия на местоположение, материал, предмет и т. д. / Считает опустошения'
    'item consume': Срабатывает, когда игрок употребляет предмет / Поддерживает расходуемые предметы, такие как еда и зелья / Считает употреблённые предметы
    'pickup exp': 'Срабатывает, когда игрок подбирает сферу опыта / Поддерживает условия на количество опыта, причину и т. д. / Считает суммарно подобранный опыт'
    'player teleport': 'Игрок телепортируется / Поддерживает условия на начальное местоположение, целевое местоположение, причину телепортации и т. д. / Считает телепортации'
