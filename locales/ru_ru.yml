  addon:
    automation: 'Автоматизирует запуск цепочек заданий / Каждые 40 тиков проверяет игроков онлайн для обработки автопринятия и заданий по расписанию'
    ui: 'Настраивает отображение заданий в интерфейсе / Управляет видимостью, иконкой и описанием задания'
    depend: 'Задаёт предварительные условия задания / Поддерживает зависимости от одного задания и от группы заданий / Поддерживает зависимости между записями / Может быть строкой, списком или строкой с разделителями-запятыми/точками с запятой'
    stats: 'Отображает прогресс задания и записей / Поддерживает полосу прогресса BossBar, пользовательские стили и вычисления скриптами / Настраивается как временное или постоянное отображение'
    restart: 'Управляет возможностью перезапуска задания / Определяет условия перезапуска через скрипты Kether'
    track: 'Отслеживает местоположения целей задания и обеспечивает навигацию по маршруту / Поддерживает отображение маяком, ориентиром, навигацией и на табло / Игрок может отслеживать только одно задание одновременно'
    party: 'Управляет функциями группы для заданий / Поддерживает общий доступ к заданию, совместное выполнение и ограничения числа игроков / Для групповых подземелий, кооперации нескольких игроков и т. д.'
    timeout: 'Задаёт время ожидания для заданий / Поддерживает фиксированную длительность и периодические моменты времени'
    reset-data-on-accepted: 'Управляет сбросом определённых данных при принятии задания / Влияет только на записи, реализующие интерфейс IPlayerData / Для сброса данных счётчика, прогресса и состояния'
    optional: 'Помечает запись задания как необязательную / Необязательные записи не влияют на завершение задания / Для бонусных наград, побочных заданий и т. д.'
    control: 'Управляет различными ограничениями заданий / Поддерживает сосуществование, повтор, ограничения перезарядки и скриптовые прокси / Настраивается как список Map, каждый Map представляет правило управления'
