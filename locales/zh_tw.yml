    action_bar: '將動作的{回傳值}以{動作欄}訊息傳送給{執行者}。'
    address: '取得玩家的 IP 位址。'
    allow_flight: 檢查或變更玩家是否允許飛行。
    array: '將動作清單的所有{回傳值}作為一個{集合}回傳。'
