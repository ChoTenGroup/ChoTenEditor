    'bed_spawn_x,y,z': '取得玩家床重生點的單一軸座標。'
    blocking: 檢查玩家是否正在格擋。
    break: '在迴圈語句（{ForEach, Join, Map, While}）中使用時，結束迴圈主體。'
    'case & when': '比 #IF 功能更豐富的複雜選擇語句。<br>完整的選擇語句至少需要一個分支，即{when 區塊}。<br><br>每個標準分支由 {when} {{condition}} -> {{expression}} 組成。<br>也可以使用 {else} {{expression}} 作為預設分支。<br><br>{範例如下：}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else "One"<br>]<br>log inline "You provide {{ &numberProvided }}"<br><br>{結果為：}<br>You provide Three<br><br>{也可以像其他語句一樣使用：}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log "One"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log "Two"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log "Three"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "One"<br>]<br><br>{或搭配多條語句使用：}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Monday"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "First day of the week"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Sunday"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other days"<br>]<br><br>{或用於邏輯判斷：}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Small"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log "Big"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log "Other"<br>]'
    check: '以多種比較模式比較兩個動作的{回傳值}。<br><br>1. 等於（{==}、{is}）：兩個值在{字面上}相同。<br>2. 不等於（{!=}、{not}）：兩個值在{字面上}不同。<br>3. 相似等於（{=?}、{is?}）：忽略{大小寫}時，兩個值在{字面上}相同。<br>4. 絕對等於（{=!}、{is!}）：兩個值在{記憶體}中相同。<br>5. 大於（{>}、{gt}）：第一個值{大於}第二個值。<br>6. 大於等於（{>=}）：第一個值{大於}或{等於}第二個值。<br>7. 小於（{<}、{lt}）：第一個值{小於}第二個值。<br>8. 小於等於（{<=}）：第一個值{小於}或{等於}第二個值。<br>9. 右包含左（in）：第二個值是否包含第一個值。<br>10. 左包含右（has）：第一個值是否包含第二個值。<br><br>{注意：}<br>使用{等於}條件比較時，會自動為兩個參數附加 {#Type} 推斷動作。'
    color: '替換動作的{回傳值}中所有{顏色代碼}。<br>支援 {TabooLib} 提供的進階顏色代碼。'
    command: '將動作的{回傳值}作為指令執行，預設以{玩家}作為執行者。'
